# Builds this fork on a GitHub-hosted macOS 26 runner, which has Xcode
# preinstalled, and uploads the finished app as a downloadable artifact.
# This exists so the fork can be built without installing ~20GB of Xcode
# locally: Command Line Tools cannot build Maccy on their own (no actool for
# Assets.xcassets, no macro plugins for @Model / #Preview).
#
# The build is ad-hoc signed, so the download is quarantined and unnotarized.
# Use script/install-artifact.sh to unpack and install it.

name: Build fork

on:
  push:
    branches: [spotlight-ui]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Release \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            CODE_SIGN_ENTITLEMENTS=Maccy/Maccy-adhoc.entitlements \
            build

      - name: Verify and package
        run: |
          APP=build/Build/Products/Release/Maccy.app
          test -d "$APP" || { echo "::error::$APP missing"; exit 1; }

          echo "--- version ---"
          defaults read "$PWD/$APP/Contents/Info.plist" CFBundleShortVersionString
          defaults read "$PWD/$APP/Contents/Info.plist" CFBundleVersion

          echo "--- signature ---"
          codesign -dv "$APP" 2>&1 || true
          codesign --verify --deep --strict "$APP" && echo "signature verifies"

          # Hardened runtime turns on library validation, which requires every
          # embedded library to share the app's Team ID. An ad-hoc signature has
          # no Team ID, so Sparkle.framework fails to map and the app dies at
          # launch with a dyld "Library missing" abort. Catch it here rather than
          # on the user's machine.
          FLAGS="$(codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/.*flags=\([^ ]*\).*/\1/p')"
          echo "signing flags: $FLAGS"
          case "$FLAGS" in
            *runtime*)
              echo "::error::hardened runtime is on for an ad-hoc signed build; embedded frameworks will fail library validation at launch"
              exit 1
              ;;
          esac

          # An ad-hoc signature cannot satisfy the App Sandbox: secinitd never
          # replies and the app deadlocks in _libsecinit_appsandbox before AppKit
          # loads, presenting as a live PID that never opens a window.
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "com.apple.security.app-sandbox"; then
            echo "::error::app-sandbox entitlement is present on an ad-hoc signed build; it will hang at launch"
            exit 1
          fi
          echo "sandbox entitlement correctly absent"

          echo "--- architectures ---"
          lipo -archs "$APP/Contents/MacOS/Maccy"

          # ditto preserves the bundle's signature and resource forks; a plain
          # `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent "$APP" Maccy.zip
          ls -lh Maccy.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Maccy-spotlight
          path: Maccy.zip
          retention-days: 30
          if-no-files-found: error
