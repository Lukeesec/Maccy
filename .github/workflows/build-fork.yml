# Build, test, and publish this fork without requiring Xcode on the installing Mac.

name: Build fork

on:
  push:
    branches: [spotlight-ui]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Debug \
            -derivedDataPath test-build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:MaccyTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            test

      - name: Build universal release
        run: |
          set -o pipefail
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Release \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Re-sign ad-hoc with fork entitlements
        run: |
          script/resign-adhoc.sh \
            build/Build/Products/Release/Maccy.app \
            Maccy/Maccy-adhoc.entitlements

      - name: Verify and package
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/Maccy.app
          test -d "$APP" || { echo "::error::$APP missing"; exit 1; }

          VERSION="$(defaults read "$PWD/$APP/Contents/Info.plist" CFBundleShortVersionString)"
          BUILD="$(defaults read "$PWD/$APP/Contents/Info.plist" CFBundleVersion)"
          echo "version: $VERSION ($BUILD)"

          codesign -dv "$APP" 2>&1 || true
          codesign --verify --deep --strict "$APP"

          FLAGS="$(codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/.*flags=\([^ ]*\).*/\1/p')"
          echo "signing flags: $FLAGS"
          case "$FLAGS" in
            *runtime*)
              echo "::error::hardened runtime is incompatible with this ad-hoc package"
              exit 1
              ;;
          esac

          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "com.apple.security.app-sandbox"; then
            echo "::error::app-sandbox entitlement is incompatible with this ad-hoc package"
            exit 1
          fi

          checked=0
          while IFS= read -r binary; do
            file "$binary" | grep -q "Mach-O" || continue
            architectures="$(lipo -archs "$binary")"
            echo "$binary: $architectures"
            case " $architectures " in *" arm64 "*) ;; *) echo "::error::$binary is missing arm64"; exit 1;; esac
            case " $architectures " in *" x86_64 "*) ;; *) echo "::error::$binary is missing x86_64"; exit 1;; esac
            checked=$((checked + 1))
          done < <(find "$APP" -type f)
          test "$checked" -gt 0 || { echo "::error::no Mach-O binaries found"; exit 1; }

          ditto -c -k --sequesterRsrc --keepParent "$APP" Maccy.zip
          shasum -a 256 Maccy.zip > Maccy.zip.sha256
          cat Maccy.zip.sha256

      - name: Upload short-lived workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maccy-spotlight
          path: |
            Maccy.zip
            Maccy.zip.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish durable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/Maccy.app
          VERSION="$(defaults read "$PWD/$APP/Contents/Info.plist" CFBundleShortVersionString)"
          BUILD="$(defaults read "$PWD/$APP/Contents/Info.plist" CFBundleVersion)"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="v${VERSION}-${BUILD}-${SHORT_SHA}"

          cat > release-notes.md <<EOF
          Automated, universal build of Maccy ${VERSION} (${BUILD}) from commit ${GITHUB_SHA}.

          - Requires macOS 14 or newer.
          - Includes arm64 and x86_64 slices.
          - Ad-hoc signed, unnotarized, unsandboxed, and without hardened runtime.
          - Verify the download with \`Maccy.zip.sha256\` or use \`script/install-artifact.sh\`.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Maccy.zip Maccy.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --latest --notes-file release-notes.md
          else
            gh release create "$TAG" Maccy.zip Maccy.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Maccy ${VERSION} (${BUILD}, ${SHORT_SHA})" \
              --notes-file release-notes.md \
              --latest
          fi
